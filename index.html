<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreya & Danny — Find Your Table</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap');

:root{
  --blue:#172944;
  --blue2:#213958;
  --gold:#c5a45f;
  --gold-soft:#e4d3a7;
  --cream:#fffaf0;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--cream);
  font-family:Montserrat,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,.045), transparent 28%),
    radial-gradient(circle at 85% 90%, rgba(197,164,95,.08), transparent 30%),
    linear-gradient(145deg,var(--blue2),var(--blue));
}
body:before{
  content:"";
  position:fixed;
  inset:16px;
  border:1px solid rgba(197,164,95,.65);
  pointer-events:none;
}
header{padding:36px 24px 24px;text-align:center}
.brand{
  font-family:"Playfair Display",Georgia,serif;
  font-size:32px;
  font-weight:500;
  color:var(--gold-soft);
}
.date{
  margin-top:8px;
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(255,250,240,.72);
}
main{display:flex;justify-content:center;padding:60px 22px 50px}
.content{width:min(520px,100%);text-align:center}
.ornament{color:var(--gold);font-size:16px;letter-spacing:8px;margin-bottom:22px}
h1{
  margin:0;
  font-family:"Playfair Display",Georgia,serif;
  font-size:43px;
  font-weight:500;
  color:var(--cream);
}
.instructions{margin:14px 0 30px;font-size:14px;color:rgba(255,250,240,.78)}
.form{max-width:420px;margin:auto}
input{
  width:100%;
  height:55px;
  border:1px solid rgba(197,164,95,.78);
  background:rgba(255,255,255,.97);
  padding:0 17px;
  font:inherit;
  font-size:15px;
  text-align:center;
  color:var(--blue);
  outline:none;
}
input:focus{box-shadow:0 0 0 2px rgba(197,164,95,.2)}
button{
  width:100%;
  height:52px;
  margin-top:11px;
  border:1px solid var(--gold);
  background:var(--gold);
  color:var(--blue);
  font-family:Montserrat,Arial,sans-serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:2.2px;
  cursor:pointer;
}
button:hover{filter:brightness(1.05)}
button:disabled{opacity:.55;cursor:default}
#result{min-height:160px;padding-top:40px}
.found-name{
  font-family:"Playfair Display",Georgia,serif;
  font-size:22px;
  color:var(--cream);
  margin-bottom:23px;
}
.table-label{
  font-size:10px;
  font-weight:600;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold-soft);
  margin-bottom:10px;
}
.table-result{
  font-family:Montserrat,Arial,sans-serif;
  font-size:31px;
  font-weight:500;
  color:var(--gold);
}
.welcome{margin-top:15px;font-size:12px;color:rgba(255,250,240,.67)}
.error,.status{
  font-size:13px;
  line-height:1.7;
  color:rgba(255,250,240,.78);
}
@media(max-width:520px){
  body:before{inset:9px}
  main{padding-top:45px}
  h1{font-size:37px}
}
</style>
</head>
<body>
<header>
  <div class="brand">Shreya &amp; Danny</div>
  <div class="date">September 19, 2026</div>
</header>

<main>
<section class="content">
  <div class="ornament">✦ ◆ ✦</div>
  <h1>Find Your Table</h1>
  <p class="instructions">Enter your full name below to find your table.</p>

  <div class="form">
    <input id="guestName" placeholder="Full name" autocomplete="name" disabled>
    <button id="findButton" disabled>LOADING GUEST LIST…</button>
  </div>

  <div id="result"><div class="status">Loading guest list…</div></div>
</section>
</main>

<script>
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR1TxEjxEEfjewjwUWLthwA4iU8IykBBk2QlMwcyV3xFurLMGJAfbj46xNN2yxeqRITQib3zxNQLbtn/pub?gid=1628993218&single=true&output=csv';
let guests = [];

function normalize(s) {
  return String(s || "")
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ")
    .replace(/[.'’\-]/g, "");
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", quoted = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') {
        field += '"'; i++;
      } else if (ch === '"') {
        quoted = false;
      } else {
        field += ch;
      }
    } else {
      if (ch === '"') {
        quoted = true;
      } else if (ch === ',') {
        row.push(field); field = "";
      } else if (ch === '\n') {
        row.push(field); rows.push(row); row = []; field = "";
      } else if (ch !== '\r') {
        field += ch;
      }
    }
  }
  row.push(field);
  if (row.some(v => v !== "")) rows.push(row);
  return rows;
}

async function loadGuests() {
  const result = document.getElementById("result");
  const input = document.getElementById("guestName");
  const button = document.getElementById("findButton");

  try {
    const separator = SHEET_CSV_URL.includes("?") ? "&" : "?";
    const response = await fetch(SHEET_CSV_URL + separator + "t=" + Date.now(), { cache: "no-store" });
    if (!response.ok) throw new Error("Could not load sheet");

    const text = await response.text();
    const rows = parseCSV(text);
    const headers = rows.shift().map(h => h.trim().toLowerCase());

    const firstIndex = headers.indexOf("first name");
    const lastIndex = headers.indexOf("last name");
    const tableIndex = headers.indexOf("table number");

    if (firstIndex < 0 || lastIndex < 0 || tableIndex < 0) {
      throw new Error("Missing expected columns");
    }

    guests = rows
      .map(r => ({
        first: (r[firstIndex] || "").trim(),
        last: (r[lastIndex] || "").trim(),
        table: (r[tableIndex] || "").trim()
      }))
      .filter(g => g.first || g.last);

    input.disabled = false;
    button.disabled = false;
    button.textContent = "FIND MY TABLE";
    result.innerHTML = "";
  } catch (err) {
    result.innerHTML = '<div class="error">We’re having trouble loading the seating list right now. Please try again in a moment.</div>';
    button.textContent = "FIND MY TABLE";
  }
}

function search() {
  const q = normalize(document.getElementById("guestName").value);
  const result = document.getElementById("result");

  if (!q) {
    result.innerHTML = '<div class="error">Please enter your full name.</div>';
    return;
  }

  const matches = guests.filter(g => normalize(g.first + " " + g.last) === q);

  if (matches.length === 1) {
    const g = matches[0];
    if (!g.table) {
      result.innerHTML = '<div class="error">Your table assignment is not available yet. Please check again later.</div>';
      return;
    }
    result.innerHTML = `
      <div class="found-name">Welcome, ${g.first}!</div>
      <div class="table-label">Your table</div>
      <div class="table-result">Table ${g.table}</div>
      <div class="welcome">We’re so happy you’re here.</div>
    `;
  } else if (matches.length > 1) {
    result.innerHTML = '<div class="error">We found more than one guest with that exact name. Please see the seating chart for assistance.</div>';
  } else {
    result.innerHTML = `
      <div class="error">
        We couldn't find that name.<br>
        Please check the spelling and enter your full name.
      </div>`;
  }
}

document.getElementById("findButton").addEventListener("click", search);
document.getElementById("guestName").addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});

loadGuests();
</script>
</body>
</html>
