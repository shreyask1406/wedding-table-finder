<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Find Your Table | Shreya & Danny</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="card">

    <div class="names">Shreya & Danny</div>
    <div class="date">SEPTEMBER 19, 2026</div>

    <div class="ornament">✦ ◆ ✦</div>

    <h1>Find Your Table</h1>

    <p class="instructions">
      Enter your full name to find your table.
    </p>

    <input
      type="text"
      id="guestName"
      placeholder="Full name"
      autocomplete="name"
    >

    <button id="findButton">
      FIND MY TABLE
    </button>

    <div id="result"></div>

  </main>

  <script src="script.js"></script>

 </body>
</html>
