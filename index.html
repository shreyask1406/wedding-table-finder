<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreya & Danny — Find Your Table</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap');

:root{
  --blue:#172944;
  --blue2:#213958;
  --gold:#c5a45f;
  --gold-soft:#e4d3a7;
  --cream:#fffaf0;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--cream);
  font-family:Montserrat,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,.045), transparent 28%),
    radial-gradient(circle at 85% 90%, rgba(197,164,95,.08), transparent 30%),
    linear-gradient(145deg,var(--blue2),var(--blue));
}
body:before{
  content:"";
  position:fixed;
  inset:16px;
  border:1px solid rgba(197,164,95,.65);
  pointer-events:none;
}
header{
  padding:36px 24px 24px;
  text-align:center;
}
.brand{
  font-family:"Playfair Display",Georgia,serif;
  font-size:32px;
  font-weight:500;
  color:var(--gold-soft);
}
.date{
  margin-top:8px;
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(255,250,240,.72);
}
main{
  display:flex;
  justify-content:center;
  padding:60px 22px 50px;
}
.content{
  width:min(520px,100%);
  text-align:center;
}
.ornament{
  color:var(--gold);
  font-size:16px;
  letter-spacing:8px;
  margin-bottom:22px;
}
h1{
  margin:0;
  font-family:"Playfair Display",Georgia,serif;
  font-size:43px;
  font-weight:500;
  color:var(--cream);
}
.instructions{
  margin:14px 0 30px;
  font-size:14px;
  color:rgba(255,250,240,.78);
}
.form{max-width:420px;margin:auto}
input{
  width:100%;
  height:55px;
  border:1px solid rgba(197,164,95,.78);
  background:rgba(255,255,255,.97);
  padding:0 17px;
  font:inherit;
  font-size:15px;
  text-align:center;
  color:var(--blue);
  outline:none;
}
input:focus{box-shadow:0 0 0 2px rgba(197,164,95,.2)}
button{
  width:100%;
  height:52px;
  margin-top:11px;
  border:1px solid var(--gold);
  background:var(--gold);
  color:var(--blue);
  font-family:Montserrat,Arial,sans-serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:2.2px;
  cursor:pointer;
}
button:hover{filter:brightness(1.05)}
#result{
  min-height:160px;
  padding-top:40px;
}
.found-name{
  font-family:"Playfair Display",Georgia,serif;
  font-size:22px;
  color:var(--cream);
  margin-bottom:23px;
}
.table-label{
  font-size:10px;
  font-weight:600;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold-soft);
  margin-bottom:10px;
}
.table-result{
  font-family:Montserrat,Arial,sans-serif;
  font-size:31px;
  font-weight:500;
  color:var(--gold);
}
.welcome{
  margin-top:15px;
  font-size:12px;
  color:rgba(255,250,240,.67);
}
.error{
  font-size:13px;
  line-height:1.7;
  color:rgba(255,250,240,.78);
}
.test{
  margin-top:32px;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1.7px;
  color:rgba(255,250,240,.38);
}
@media(max-width:520px){
  body:before{inset:9px}
  main{padding-top:45px}
  h1{font-size:37px}
}
</style>
</head>
<body>
<header>
  <div class="brand">Shreya &amp; Danny</div>
  <div class="date">September 19, 2026</div>
</header>
<main>
<section class="content">
  <div class="ornament">✦ ◆ ✦</div>
  <h1>Find Your Table</h1>
  <p class="instructions">Enter your full name below to find your table.</p>
  <div class="form">
    <input id="guestName" placeholder="Full name" autocomplete="name">
    <button id="findButton">FIND MY TABLE</button>
  </div>
  <div id="result"></div>
  <div class="test">Test version — enter “Test Guest”</div>
</section>
</main>
<script>
const guests=[{name:"Test Guest",table:"1"}];
const normalize=s=>s.toLowerCase().trim().replace(/\s+/g," ").replace(/[.'’-]/g,"");
function search(){
 const q=normalize(document.getElementById("guestName").value);
 const r=document.getElementById("result");
 if(!q){r.innerHTML='<div class="error">Please enter your full name.</div>';return;}
 const m=guests.find(g=>normalize(g.name)===q);
 if(m){
  r.innerHTML=`<div class="found-name">Welcome, ${m.name.split(" ")[0]}!</div>
  <div class="table-label">Your table</div>
  <div class="table-result">Table ${m.table}</div>
  <div class="welcome">We’re so happy you’re here.</div>`;
 }else{
  r.innerHTML=`<div class="error">We couldn't find that name.<br>Please check the spelling and enter the full name on your invitation.</div>`;
 }
}
document.getElementById("findButton").onclick=search;
document.getElementById("guestName").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
</script>
</body>
</html>
